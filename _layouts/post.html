---
layout: default
---

{% if page.hero_image %}
<div class="hero-wrapper">
  <img src="{{ page.hero_image }}" class="hero-image" alt="{{ page.title }}">
</div>
{% endif %}

<article class="post">
  <br>
  <a href="{{ site.baseurl }}/blog" class="back-button"><strong>BACK TO BLOG</strong></a>
  <br>
  <h1>{{ page.title }}</h1>
    <hr class="short" style="margin: 0.5em 0;">
  <div class="date">
    {{ page.date | date: "%B %e, %Y" }}
  </div>
  <p>
  <hr>
  <div class="entry">
    {{ content }}
  </div>
  <br>
  <hr>
  <a href="{{ site.baseurl }}/blog" class="back-button"><strong>BACK TO BLOG</strong></a>

  {% include disqus.html %}
</article>
