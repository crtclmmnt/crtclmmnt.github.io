<script type="text/babel">
const { useState, useEffect } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const ALL_WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DIET_PRESETS = ['Vegetarian','Vegan','Gluten-free','Nut-free','Dairy-free','Halal','Kosher','Alcohol-free'];
const WORDS = ['SAGE','FERN','REED','CLAY','PINE','MOSS','WREN','DOVE','DUSK','DAWN',
               'TIDE','RAIN','MIST','IRIS','LARK','BRINE','ROUX','BROTH','CRESS','THYME'];

const TIME_SLOTS = (() => {
  const out = [];
  for (let h = 16; h <= 21; h++) {
    for (const m of (h === 21 ? [0] : [0,15,30,45])) {
      out.push(`${h-12}:${m===0?'00':m} PM`);
    }
  }
  return out;
})();

const PREP_SLOTS = (() => {
  const out = [];
  for (let h = 15; h <= 21; h++) {
    for (const m of (h === 21 ? [0] : [0,15,30,45])) {
      out.push(`${h-12}:${m===0?'00':m} PM`);
    }
  }
  return out;
})();

const C = {
  babyYellow:'#f1e6c9', darkRose:'#a23c3f', darkerGray:'#222', darkGray:'#333',
  gray:'#666', mint:'#9DF4B0', darkMint:'#377048', rose:'#F5898D',
  peach:'#FBB965', darkPeach:'#ac7022', lightGray:'#eee', white:'#fff',
};

const DAY_THRESHOLD = 0.75;

// ─── STORAGE ──────────────────────────────────────────────────────────────────

function fromFirebase(val) {
  if (val === null || val === undefined) return val;
  if (typeof val !== 'object') return val;
  if (Array.isArray(val)) return val.map(fromFirebase);
  const keys = Object.keys(val);
  if (keys.length > 0 && keys.every(k => /^\d+$/.test(k))) {
    const arr = [];
    for (const k of keys) arr[Number(k)] = fromFirebase(val[k]);
    return arr;
  }
  const out = {};
  for (const k of keys) out[k] = fromFirebase(val[k]);
  return out;
}

const Store = {
  async savePool(pool) {
    pool.lastActive = Date.now();
    await db.ref(`pools/${pool.code}`).set(pool);
  },
  async getPool(code) {
    const snap = await db.ref(`pools/${code}`).once('value');
    return fromFirebase(snap.val());
  },
  subscribePool(code, callback) {
    const ref = db.ref(`pools/${code}`);
    ref.on('value', snap => callback(fromFirebase(snap.val())));
    return () => ref.off('value');
  },
  getSession() { try { return JSON.parse(localStorage.getItem('bt_session')); } catch { return null; } },
  saveSession(s) { try { localStorage.setItem('bt_session',JSON.stringify(s)); } catch {} },
  clearSession() { try { localStorage.removeItem('bt_session'); } catch {} },
};

// ─── UTILITIES / LOGIC ────────────────────────────────────────────────────────

function genCode() {
  return `${WORDS[Math.floor(Math.random()*WORDS.length)]}-${String(Math.floor(Math.random()*9000)+1000)}`;
}
function sanitizeName(s) { return s.replace(/\s/g,'').slice(0,6); }
function slotIdx(t) { return TIME_SLOTS.indexOf(t); }

function computeConsensus(pool, useRunoff = false) {
  const members = pool.members;
  const total = members.length;
  const proposedDays = useRunoff
    ? (pool.runoffSettings?.newDays || [])
    : pool.settings.days;
  const proposedWindow = useRunoff
    ? (pool.runoffSettings?.newWindow || pool.settings.proposedWindow)
    : pool.settings.proposedWindow;

  const days = {};
  for (const day of proposedDays) {
    const accepting = members.filter(m =>
      useRunoff ? (m.runoffDayVotes && m.runoffDayVotes[day]) : (m.dayVotes && m.dayVotes[day])
    ).length;
    const pct = total > 0 ? accepting / total : 0;
    days[day] = { votes: accepting, total, pct, passes: pct >= DAY_THRESHOLD, zero: accepting === 0 };
  }

  let agreedStart = proposedWindow.earliest;
  let agreedEnd   = proposedWindow.latest;
  for (const m of members) {
    const sv = useRunoff ? m.runoffStartVote : m.startVote;
    const ev = useRunoff ? m.runoffEndVote   : m.endVote;
    if (sv && slotIdx(sv) > slotIdx(agreedStart)) agreedStart = sv;
    if (ev && slotIdx(ev) < slotIdx(agreedEnd))   agreedEnd   = ev;
  }
  const minuteSpan = (slotIdx(agreedEnd) - slotIdx(agreedStart)) * 15;
  return { days, window: { agreedStart, agreedEnd, minuteSpan, tooNarrow: minuteSpan <= 30 } };
}

function buildSchedule(members, agreedDays, agreedWindow, cooksPer, delayWeeks = 0) {
  const DAY_NUM = { Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0 };
  const NUM_TO_DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Which agreed days each member voted to cook on
  const eligibleDays = {};
  for (const m of members) {
    eligibleDays[m.name] = new Set(agreedDays.filter(d => m.dayVotes && m.dayVotes[d]));
  }

  // Cook queue: members who still need to be assigned as cook once
  // Members with no eligible days are excluded from the cook queue (attend only as guests)
  const needToCook = new Set(members.map(m => m.name).filter(n => eligibleDays[n].size > 0));

  const activeDayNums = new Set(agreedDays.map(d => DAY_NUM[d]));
  const cursor = new Date();
  cursor.setDate(cursor.getDate() + 1 + (delayWeeks || 0) * 7); cursor.setHours(0,0,0,0);

  const schedule = [];
  let safety = 400;

  while (needToCook.size > 0 && safety-- > 0) {
    if (!activeDayNums.has(cursor.getDay())) {
      cursor.setDate(cursor.getDate()+1);
      continue;
    }
    const dayName = NUM_TO_DAY[cursor.getDay()];

    // Eligible cooks tonight: in queue AND voted for this day; most-constrained first
    const eligibleTonight = [...needToCook]
      .filter(name => eligibleDays[name].has(dayName))
      .sort((a, b) => {
        const diff = eligibleDays[a].size - eligibleDays[b].size;
        return diff !== 0 ? diff : a.localeCompare(b);
      });

    if (eligibleTonight.length > 0) {
      const cooks = eligibleTonight.slice(0, cooksPer);
      cooks.forEach(name => needToCook.delete(name));
      schedule.push({
        date: `${NUM_TO_DAY[cursor.getDay()]} ${MO[cursor.getMonth()]} ${cursor.getDate()}`,
        cooks, agreedWindow,
        optedOut: [],  // member names who can't make it that night
        meal: null
      });
    }

    cursor.setDate(cursor.getDate()+1);
  }

  return schedule;
}

// Returns updated pool after creator finalizes decisions; may set status to 'scheduled' or 'runoff'
function applyCreatorDecisions(pool, decisions, runoffProposal) {
  // decisions: { [day]: 'include'|'drop' } for marginal days
  // runoffProposal: { newDays, newWindow } | null
  const report = pool.consensusReport;

  // Build the list of agreed days from primary voting
  const agreedDays = pool.settings.days.filter(day => {
    const d = report.days[day];
    if (d.passes) return true;
    if (d.zero)   return false; // zero days go to runoff or are dropped
    return decisions[day] === 'include';
  });

  const needsRunoff = runoffProposal && (
    (runoffProposal.newDays && runoffProposal.newDays.length > 0) ||
    runoffProposal.newWindow
  );

  if (needsRunoff) {
    const resetMembers = pool.members.map(m => ({
      ...m, runoffDayVotes: null, runoffStartVote: null,
      runoffEndVote: null, runoffVoted: false
    }));
    return { ...pool, members: resetMembers, agreedDays,
             runoffSettings: runoffProposal, status: 'runoff', creatorDecisions: decisions };
  }

  // No runoff — finalize immediately
  const aw = { earliest: report.window.agreedStart, latest: report.window.agreedEnd };
  const schedule = buildSchedule(pool.members, agreedDays, aw, pool.settings.cooksPer, pool.settings.scheduleDelayWeeks);
  return { ...pool, agreedDays, agreedWindow: aw, schedule, status: 'scheduled',
           creatorDecisions: decisions };
}

function finalizeRunoff(pool) {
  const rc = computeConsensus(pool, true);
  const baseDays = pool.agreedDays || [];
  const newDays = (pool.runoffSettings?.newDays || []).filter(d => rc.days[d]?.passes);
  const agreedDays = [...new Set([...baseDays, ...newDays])];

  let aw;
  if (pool.runoffSettings?.newWindow && !rc.window.tooNarrow) {
    aw = { earliest: rc.window.agreedStart, latest: rc.window.agreedEnd };
  } else {
    aw = pool.agreedWindow || { earliest: pool.consensusReport.window.agreedStart, latest: pool.consensusReport.window.agreedEnd };
  }

  const schedule = buildSchedule(pool.members, agreedDays, aw, pool.settings.cooksPer, pool.settings.scheduleDelayWeeks);
  return { ...pool, agreedDays, agreedWindow: aw, schedule, status: 'scheduled', runoffReport: rc };
}

function computeAgreedWindow(pool) {
  const pw = pool.settings.proposedWindow;
  let agreedStart = pw.earliest;
  let agreedEnd = pw.latest;
  for (const m of pool.members) {
    if (m.startVote && slotIdx(m.startVote) > slotIdx(agreedStart)) agreedStart = m.startVote;
    if (m.endVote && slotIdx(m.endVote) < slotIdx(agreedEnd)) agreedEnd = m.endVote;
  }
  const minuteSpan = (slotIdx(agreedEnd) - slotIdx(agreedStart)) * 15;
  return { earliest: agreedStart, latest: agreedEnd, minuteSpan, tooNarrow: minuteSpan <= 30 };
}

function lockInDays(pool, selectedDays) {
  const aw = computeAgreedWindow(pool);
  const agreedWindow = { earliest: aw.earliest, latest: aw.latest };
  const schedule = buildSchedule(pool.members, selectedDays, agreedWindow, pool.settings.cooksPer, pool.settings.scheduleDelayWeeks);
  return { ...pool, agreedDays: selectedDays, agreedWindow, schedule, status: 'scheduled' };
}

function Btn({ children, onClick, variant='primary', disabled=false, fullWidth=false, style={} }) {
  const variants = {
    primary:{ background:C.babyYellow, color:C.darkerGray },
    danger: { background:C.rose,       color:C.darkRose   },
    success:{ background:C.mint,       color:C.darkMint   },
    muted:  { background:C.lightGray,  color:C.gray       },
    accent: { background:C.peach,      color:C.darkPeach  },
    dark:   { background:C.darkRose,   color:C.white      },
  };
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display:'inline-block', padding:'10px 22px', borderRadius:'22px', border:'none',
      cursor: disabled?'not-allowed':'pointer', fontFamily:"'Roboto',sans-serif",
      fontSize:'15px', fontWeight:'500', opacity: disabled?0.5:1,
      width: fullWidth?'100%':'auto',
      ...(variants[variant]||variants.primary), ...style
    }}>{children}</button>
  );
}

}

}

}

  return (
    <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
      <div style={{ flex:1, height:'8px', background:C.lightGray, borderRadius:'4px', overflow:'hidden' }}>
        <div style={{ width:`${Math.round(pct*100)}%`, height:'100%', background:color, borderRadius:'4px', transition:'width 0.3s' }} />
      </div>
      <span style={{ fontSize:'13px', fontWeight:'600', color:textColor, minWidth:'36px' }}>
        {Math.round(pct*100)}%
      </span>
    </div>
  );
}

function HomeScreen({ onCreate, onJoin }) {
  return (
    <div style={{ display:'flex', justifyContent:'center', paddingTop:'32px' }}>
      <div style={{ textAlign:'center', maxWidth:'480px', width:'100%',
        border:`3px solid ${C.darkRose}`, borderRadius:'15px',

        <p style={{ color:C.gray, fontSize:'18px', marginBottom:'32px', lineHeight:1.5,

        </p>

          <Btn onClick={onJoin} style={{ fontSize:'17px', padding:'14px 32px', background:C.white, color:C.darkerGray }}>Join a table</Btn>

        <p style={{ color:C.gray, marginTop:'32px', fontSize:'13px', fontStyle:'italic' }}>
          where everyone cooks, everyone eats.
        </p>

// ─── CREATE SCREEN ────────────────────────────────────────────────────────────

function CreateScreen({ onBack, onEnterRoom }) {
  const [tableName, setTableName] = useState('');
  const [myName,    setMyName]    = useState('');
  const [presets,   setPresets]   = useState([]);
  const [dietNote,  setDietNote]  = useState('');
  const [days,      setDays]      = useState([]);
  const [startTime, setStartTime] = useState('6:00 PM');
  const [endTime,   setEndTime]   = useState('8:00 PM');
  const [cooksPer,       setCooksPer]       = useState(1);
  const [maxPax,         setMaxPax]         = useState('');
  const [scheduleDelay,  setScheduleDelay]  = useState(0);
  const [error,          setError]          = useState('');

  const togglePreset = p => setPresets(prev => prev.includes(p) ? prev.filter(x=>x!==p) : [...prev,p]);

  const toggleDay = d => setDays(prev => prev.includes(d) ? prev.filter(x=>x!==d) : [...prev,d]);
  const endOpts = TIME_SLOTS.filter((_,i) => i > slotIdx(startTime));

  const maxPaxNum = maxPax === '' ? null : parseInt(maxPax, 10);
  const maxPaxValid = maxPaxNum === null || (maxPaxNum > 0 && maxPaxNum % cooksPer === 0);

  const handleSubmit = async () => {
    if (!tableName.trim()) return setError('Give your table a name.');
    if (!myName.trim())    return setError('What should we call you?');
    if (days.length === 0) return setError('Pick at least one active day.');
    if (slotIdx(startTime) >= slotIdx(endTime)) return setError('End time must be after start time.');
    if (!maxPaxValid) return setError(`Max participants must be a multiple of ${cooksPer}.`);
    setError('');

    const code = genCode();
    const name = sanitizeName(myName);
    const defaultDayVotes = {};
    days.forEach(d => { defaultDayVotes[d] = true; });

    const pool = {
      code, name: tableName.trim(), status: 'open',
      settings: { days: DAYS, cooksPer, maxParticipants: maxPaxNum,
                  proposedWindow: { earliest: startTime, latest: endTime },
                  scheduleDelayWeeks: scheduleDelay },
      members: [{
        name, diet:{ presets, note:dietNote.trim() }, isCreator:true, joinedAt:Date.now(),
        dayVotes: defaultDayVotes, startVote: startTime, endVote: endTime,
        voted:true, runoffDayVotes:null, runoffStartVote:null, runoffEndVote:null, runoffVoted:false
      }],
      consensusReport:null, creatorDecisions:{}, runoffSettings:null, runoffReport:null,
      agreedWindow:null, agreedDays:null, schedule:null,
      createdAt:Date.now(), lastActive:Date.now()
    };
    await Store.savePool(pool);
    Store.saveSession({ code, name });
    onEnterRoom({ code, name });
  };

  return (
    <div style={{ maxWidth:'520px', margin:'0 auto' }}>
      <BackBtn onClick={onBack} />
      <GuidanceBanner>Step 1: Add your dietary preferences and scheduling info to create a table, then share the room code with your friends so they can join!</GuidanceBanner>
      <h2 style={{ fontFamily:"'ZTNature',Helvetica,sans-serif", fontSize:'34px', fontWeight:'500',
        color:C.darkerGray, marginBottom:'28px' }}>Create a new table</h2>

      <Field label="Table name">
        <TInput value={tableName} onChange={setTableName} placeholder="Mission St Suppers" maxLength={40} />
      </Field>

      <Field label="Your name" hint="Up to 6 characters, no spaces — a nod to The Dispossessed.">
        <TInput value={myName} onChange={v=>setMyName(sanitizeName(v))} placeholder="Shevek" maxLength={6} />
        {myName && <div style={{ fontSize:'13px', color:C.gray, marginTop:'5px' }}>
          Will appear as: <strong>{sanitizeName(myName)}</strong></div>}
      </Field>

      <Field label="Your dietary restrictions" hint="Optional — helps whoever's cooking plan their menu.">
        <div style={{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'10px' }}>
          {DIET_PRESETS.map(p => (
            <Chip key={p} label={p} active={presets.includes(p)} onClick={()=>togglePreset(p)} />
          ))}
        </div>
        <TInput value={dietNote} onChange={setDietNote} placeholder="Anything else? (e.g. no shellfish)" maxLength={100} />
      </Field>

      <Field label="Which days work for you?">
        <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
          {DAYS.map(d => <Chip key={d} label={d} active={days.includes(d)} onClick={()=>toggleDay(d)} />)}
        </div>
        {days.length === 0 && (
          <div style={{ fontSize:'13px', color:C.gray, marginTop:'8px' }}>Select at least one day to continue.</div>
        )}
      </Field>

      <Field label="Proposed dinner window">
        <div style={{ display:'flex', gap:'12px', alignItems:'center', flexWrap:'wrap' }}>
          <SInput value={startTime} onChange={v => {
            setStartTime(v);
            if (slotIdx(v) >= slotIdx(endTime)) setEndTime(TIME_SLOTS[slotIdx(v)+1] || TIME_SLOTS[TIME_SLOTS.length-1]);
          }}>
            {TIME_SLOTS.slice(0,-1).map(t => <option key={t} value={t}>{t}</option>)}
          </SInput>

          <option value={3}>3 weeks</option>

  );

function JoinCodeScreen({ onBack, onSelectMember, onJoinNew }) {

    if (!p) return setError("Can't find a table with that code. Double-check with whoever shared it.");

      padding:'14px 20px', borderRadius:'12px', border:`2px solid ${C.darkRose}`,

      <div style={{ maxWidth:'520px', margin:'0 auto' }}>

          <>
            <SLabel style={{ marginBottom:'12px' }}>Who are you?</SLabel>
            <div style={{ display:'flex', flexDirection:'column', gap:'8px', marginBottom:'12px' }}>
              {pool.members.map(m => (
                <button key={m.name} onClick={()=>onSelectMember(pool, m.name)} style={memberBtnStyle}>

function JoinNewScreen({ pool, onBack, onEnterRoom }) {
  const [myName,   setMyName]   = useState('');
  const [presets,  setPresets]  = useState([]);
  const [dietNote, setDietNote] = useState('');
  const [error,    setError]    = useState('');

  // Day votes: start with nothing selected
  const [dayVotes, setDayVotes] = useState({});

  // Time votes: default to proposed window
  const [startAccept, setStartAccept] = useState(true);
  const [endAccept,   setEndAccept]   = useState(true);
  const [startVote,   setStartVote]   = useState(TIME_SLOTS[slotIdx(pool.settings.proposedWindow.earliest)+1] || pool.settings.proposedWindow.earliest);
  const [endVote,     setEndVote]     = useState(TIME_SLOTS[slotIdx(pool.settings.proposedWindow.latest)-1] || pool.settings.proposedWindow.latest);

  const pw = pool.settings.proposedWindow;
  const laterStarts = TIME_SLOTS.filter((_,i) => i > slotIdx(pw.earliest));
  const altEnds     = TIME_SLOTS.filter(t => t !== pw.latest);

  const togglePreset = p => setPresets(prev => prev.includes(p) ? prev.filter(x=>x!==p) : [...prev,p]);

  const noDaysSelected = Object.values(dayVotes).every(v => !v);

  const handleSubmit = async () => {
    if (!myName.trim()) return setError('What should we call you?');
    const name = sanitizeName(myName);
    if (pool.members.find(m => m.name === name)) return setError('That name is already taken at this table. Try a variation.');
    if (noDaysSelected) return setError('Select at least one day to continue.');
    setError('');

    const member = {
      name, diet:{ presets, note:dietNote.trim() }, isCreator:false, joinedAt:Date.now(),
      dayVotes,
      startVote: startAccept ? pw.earliest : startVote,
      endVote:   endAccept   ? pw.latest   : endVote,
      voted:true, runoffDayVotes:null, runoffStartVote:null, runoffEndVote:null, runoffVoted:false
    };

    const updated = { ...pool, members:[...pool.members, member] };

    await Store.savePool(updated);
    Store.saveSession({ code:pool.code, name });
    onEnterRoom({ code:pool.code, name });
  };

  return (
    <div style={{ maxWidth:'520px', margin:'0 auto' }}>
      <BackBtn onClick={onBack} />
      <GuidanceBanner>Step 1: Add your dietary preferences and availability to join {pool.name}, then wait for the host to lock in the schedule!</GuidanceBanner>
      <h2 style={{ fontFamily:"'ZTNature',Helvetica,sans-serif", fontSize:'34px', fontWeight:'500',
        color:C.darkerGray, marginBottom:'8px' }}>Join {pool.name}</h2>
      <div style={{ fontSize:'14px', color:C.gray, marginBottom:'24px', fontFamily:'monospace', letterSpacing:'1px' }}>{pool.code}</div>

      <Field label="Your name" hint="Up to 6 characters, no spaces.">
        <TInput value={myName} onChange={v=>setMyName(sanitizeName(v))} placeholder="Takver" maxLength={6} />
        {myName && <div style={{ fontSize:'13px', color:C.gray, marginTop:'5px' }}>
          Will appear as: <strong>{sanitizeName(myName)}</strong></div>}
      </Field>

      <Field label="Dietary restrictions" hint="Optional — helps whoever's cooking plan their menu.">
        <div style={{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'10px' }}>
          {DIET_PRESETS.map(p => (
            <Chip key={p} label={p} active={presets.includes(p)} onClick={()=>togglePreset(p)} />
          ))}
        </div>
        <TInput value={dietNote} onChange={setDietNote} placeholder="Anything else? (e.g. no shellfish)" maxLength={100} />
      </Field>

      <Field label="Which days work for you?">
        <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
          {DAYS.map(d => (
            <Chip key={d} label={d} active={!!dayVotes[d]}
              onClick={()=>setDayVotes(prev=>({...prev,[d]:!prev[d]}))} />
          ))}
        </div>
        {noDaysSelected && (
          <div style={{ fontSize:'13px', color:C.gray, marginTop:'8px' }}>Select at least one day to continue.</div>
        )}
      </Field>

      <Field label="Dinner window">
        <div style={{ marginBottom:'14px' }}>
          <div style={{ fontSize:'14px', fontWeight:'600', color:C.darkGray, marginBottom:'8px' }}>
            Proposed start: <span style={{ color:C.darkMint }}>{pw.earliest}</span>
          </div>
          <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
            <Chip label={`${pw.earliest} works for me`} active={startAccept} onClick={()=>setStartAccept(true)} />
            <Chip label="Too early for me" active={!startAccept}
              onClick={()=>setStartAccept(false)}
              activeColor={C.darkRose} activeBg={C.rose} />
          </div>
          {!startAccept && laterStarts.length > 0 && (
            <div style={{ marginTop:'10px' }}>
              <div style={{ fontSize:'13px', color:C.gray, marginBottom:'6px' }}>I need a later start:</div>
              <SInput value={startVote} onChange={setStartVote}>
                {laterStarts.map(t => <option key={t} value={t}>{t}</option>)}
              </SInput>
            </div>
          )}
        </div>

        <div>
          <div style={{ fontSize:'14px', fontWeight:'600', color:C.darkGray, marginBottom:'8px' }}>
            Proposed end: <span style={{ color:C.darkMint }}>{pw.latest}</span>
          </div>
          <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
            <Chip label={`${pw.latest} works for me`} active={endAccept} onClick={()=>setEndAccept(true)} />

              onClick={()=>setEndAccept(false)}
              activeColor={C.darkRose} activeBg={C.rose} />
          </div>
          {!endAccept && altEnds.length > 0 && (

function ConsensusReport({ pool, isCreator, onFinalize }) {
  const report = pool.consensusReport;
  const [decisions, setDecisions] = useState(() => {
    const d = { ...pool.creatorDecisions };
    pool.settings.days.forEach(day => {
      const dd = report.days[day];
      if (!dd.passes && !dd.zero && !d[day]) d[day] = '';
    });
    return d;
  });
  const [showRunoffForm, setShowRunoffForm] = useState(false);
  const [runoffDays, setRunoffDays] = useState({});
  const [runoffWindowNeeded, setRunoffWindowNeeded] = useState(report.window.tooNarrow);
  const [runoffStart, setRunoffStart] = useState(pool.settings.proposedWindow.earliest);
  const [runoffEnd,   setRunoffEnd]   = useState(pool.settings.proposedWindow.latest);
  const [error, setError] = useState('');

  const zeroDays = pool.settings.days.filter(d => report.days[d].zero);
  const marginalDays = pool.settings.days.filter(d => !report.days[d].passes && !report.days[d].zero);
  const allMarginalDecided = marginalDays.every(d => decisions[d] === 'include' || decisions[d] === 'drop');

  const runoffNeeded = zeroDays.length > 0 || report.window.tooNarrow;
  const canProceed = allMarginalDecided;

  const handleProceed = () => {
    if (!canProceed) return setError('Make a decision for all flagged days first.');
    setError('');
    if (runoffNeeded) {
      setShowRunoffForm(true);
    } else {
      onFinalize(decisions, null);
    }
  };

  const handleStartRunoff = () => {
    const unresolved = zeroDays.filter(d => runoffDays[d] === undefined);
    if (unresolved.length > 0) return setError('Select a replacement or drop each flagged day to continue.');
    const newDays = Object.entries(runoffDays).filter(([,v])=>v!=='drop').map(([,v])=>v).filter(Boolean);
    const newWindow = runoffWindowNeeded ? { earliest:runoffStart, latest:runoffEnd } : null;
    if (runoffWindowNeeded && slotIdx(runoffStart) >= slotIdx(runoffEnd))
      return setError('End time must be after start time.');
    const minuteSpan = runoffWindowNeeded ? (slotIdx(runoffEnd)-slotIdx(runoffStart))*15 : 999;
    if (runoffWindowNeeded && minuteSpan <= 30)
      return setError('New window must be wider than 30 minutes.');
    setError('');
    onFinalize(decisions, (newDays.length > 0 || newWindow) ? { newDays, newWindow } : null);
  };

  if (!isCreator) {
    // Non-creator sees read-only report
    return (
      <Card>
        <SLabel style={{ marginBottom:'12px' }}>Table has been closed</SLabel>
        <div style={{ fontSize:'14px', color:C.gray }}>
          The creator is reviewing the consensus and will finalize the schedule soon.
        </div>
      </Card>
    );
  }

  return (
    <div>
      <Card>
        <SLabel style={{ marginBottom:'14px' }}>Consensus report</SLabel>

        <div style={{ marginBottom:'16px' }}>
          <div style={{ fontSize:'13px', color:C.gray, fontWeight:'500', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:'8px' }}>Days</div>
          {pool.settings.days.map(day => {
            const d = report.days[day];
            return (
              <div key={day} style={{ marginBottom:'12px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'4px' }}>
                  <span style={{ minWidth:'36px', fontSize:'14px', fontWeight:'600', color:C.darkGray }}>{day}</span>
                  <div style={{ flex:1 }}><PctBar pct={d.pct} passes={d.passes} zero={d.zero} /></div>
                  <span style={{ fontSize:'12px', color:C.gray }}>{d.votes}/{d.total}</span>
                </div>
                {d.passes && <div style={{ fontSize:'12px', color:C.darkMint, marginLeft:'46px' }}>Included</div>}
                {d.zero && <div style={{ fontSize:'12px', color:C.darkRose, marginLeft:'46px' }}>Zero acceptance — needs a new round</div>}
                {!d.passes && !d.zero && (
                  <div style={{ display:'flex', gap:'8px', marginLeft:'46px', flexWrap:'wrap' }}>
                    <Chip label="Include anyway" active={decisions[day]==='include'}
                      onClick={()=>setDecisions(prev=>({...prev,[day]:'include'}))} />
                    <Chip label="Drop this day" active={decisions[day]==='drop'}
                      onClick={()=>setDecisions(prev=>({...prev,[day]:'drop'}))}
                      activeColor={C.darkRose} activeBg={C.rose} />
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ marginBottom:'16px' }}>
          <div style={{ fontSize:'13px', color:C.gray, fontWeight:'500', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:'8px' }}>Dinner window</div>
          <div style={{ fontSize:'14px', color:C.darkGray, marginBottom:'4px' }}>
            Agreed: <strong>{report.window.agreedStart}</strong> – <strong>{report.window.agreedEnd}</strong>
            {' '}({report.window.minuteSpan} min)
          </div>
          {report.window.tooNarrow
            ? <div style={{ fontSize:'13px', color:C.darkRose }}>Too narrow — needs a new round with a wider window</div>
            : <div style={{ fontSize:'13px', color:C.darkMint }}>Wide enough</div>
          }
        </div>
      </Card>

      {!showRunoffForm && (
        <>
          <ErrMsg msg={error} />
          <Btn onClick={handleProceed} disabled={!canProceed} style={{ marginRight:'8px' }}>
            {runoffNeeded ? 'Continue to round 2 setup →' : 'Generate schedule'}
          </Btn>
        </>
      )}

      {showRunoffForm && (
        <Card style={{ border:`2px solid ${C.peach}` }}>
          <SLabel style={{ marginBottom:'14px' }}>Round 2 setup</SLabel>
          <div style={{ fontSize:'14px', color:C.gray, marginBottom:'16px' }}>
            Propose new values for flagged items. Members will re-vote on these only.
          </div>

          {zeroDays.map(day => (
            <div key={day} style={{ marginBottom:'16px' }}>
              <div style={{ fontSize:'14px', fontWeight:'600', color:C.darkGray, marginBottom:'8px' }}>
                {day} had 0% acceptance. Propose a replacement or drop it:
              </div>
              <div style={{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'8px' }}>
                <Chip label="Drop it" active={runoffDays[day]==='drop'}
                  onClick={()=>setRunoffDays(prev=>({...prev,[day]:'drop'}))}
                  activeColor={C.darkRose} activeBg={C.rose} />
              </div>
              <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
                {DAYS.filter(d=>d!==day && !pool.settings.days.includes(d)).map(d => (
                  <Chip key={d} label={d} active={runoffDays[day]===d}
                    onClick={()=>setRunoffDays(prev=>({...prev,[day]:d}))} />
                ))}
                {pool.settings.days.filter(d=>d!==day).map(d => (
                  <Chip key={d} label={`${d} again`} active={runoffDays[day]===d}
                    onClick={()=>setRunoffDays(prev=>({...prev,[day]:d}))} />
                ))}
              </div>
            </div>
          ))}

          {report.window.tooNarrow && (
            <div style={{ marginBottom:'16px' }}>
              <div style={{ fontSize:'14px', fontWeight:'600', color:C.darkGray, marginBottom:'8px' }}>
                Propose a new wider dinner window:
              </div>
              <div style={{ display:'flex', gap:'12px', alignItems:'center', flexWrap:'wrap', marginBottom:'8px' }}>
                <SInput value={runoffStart} onChange={v=>{
                  setRunoffStart(v);
                  if (slotIdx(v) >= slotIdx(runoffEnd)) setRunoffEnd(TIME_SLOTS[slotIdx(v)+1]||TIME_SLOTS[TIME_SLOTS.length-1]);
                }}>
                  {TIME_SLOTS.slice(0,-1).map(t=><option key={t} value={t}>{t}</option>)}
                </SInput>
                <span style={{ color:C.gray }}>to</span>
                <SInput value={runoffEnd} onChange={setRunoffEnd}>
                  {TIME_SLOTS.filter((_,i)=>i>slotIdx(runoffStart)).map(t=><option key={t} value={t}>{t}</option>)}
                </SInput>
              </div>
            </div>
          )}

          <ErrMsg msg={error} />
          <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
            <Btn onClick={handleStartRunoff} variant="dark">Start round 2</Btn>
            <Btn onClick={()=>setShowRunoffForm(false)} variant="muted">Back</Btn>
          </div>
        </Card>
      )}
    </div>
  );
}

function RunoffVoting({ pool, myName, onUpdate }) {
  const me = pool.members.find(m => m.name === myName);
  const rs = pool.runoffSettings;
  const isCreator = me?.isCreator;
  const allRunoffVoted = pool.members.every(m => m.runoffVoted);

  // Creator's runoff vote is auto-applied (they proposed the values)
  useEffect(() => {
    if (isCreator && !me.runoffVoted) {
      const defaultDayVotes = {};
      (rs.newDays||[]).forEach(d => { defaultDayVotes[d] = true; });
      const updated = {
        ...pool,
        members: pool.members.map(m => m.name === myName ? {
          ...m,
          runoffDayVotes: defaultDayVotes,
          runoffStartVote: rs.newWindow ? rs.newWindow.earliest : null,
          runoffEndVote:   rs.newWindow ? rs.newWindow.latest   : null,
          runoffVoted: true
        } : m)
      };
      onUpdate(updated);
    }
  }, []);

  // Non-creator voting form
  const [dayVotes, setDayVotes] = useState(() => {
    const v = {};
    (rs.newDays||[]).forEach(d => { v[d] = true; });
    return v;
  });
  const [startAccept, setStartAccept] = useState(true);
  const [endAccept,   setEndAccept]   = useState(true);
  const nw = rs.newWindow;
  const [startVote, setStartVote] = useState(nw ? (TIME_SLOTS[slotIdx(nw.earliest)+1]||nw.earliest) : '');
  const [endVote,   setEndVote]   = useState(nw ? (TIME_SLOTS[slotIdx(nw.latest)-1]||nw.latest) : '');

  const handleSubmitVote = () => {
    const updated = {
      ...pool,
      members: pool.members.map(m => m.name === myName ? {
        ...m,
        runoffDayVotes: dayVotes,
        runoffStartVote: nw ? (startAccept ? nw.earliest : startVote) : null,
        runoffEndVote:   nw ? (endAccept   ? nw.latest   : endVote)   : null,
        runoffVoted: true
      } : m)
    };
    onUpdate(updated);
  };

  const handleFinalize = () => {
    const finalized = finalizeRunoff(pool);
    onUpdate(finalized);
  };

  if (me?.runoffVoted && !isCreator) {
    return (
      <Card style={{ background:C.mint }}>
        <div style={{ color:C.darkMint, fontWeight:'600', fontSize:'15px' }}>

          {pool.members.filter(m=>m.runoffVoted).length} of {pool.members.length} have voted

      </Card>
    );
  }

  if (isCreator) {
    const voted = pool.members.filter(m=>m.runoffVoted).length;
    return (
      <Card>
        <SLabel style={{ marginBottom:'8px' }}>Round 2 in progress</SLabel>
        <div style={{ fontSize:'14px', color:C.gray, marginBottom:'12px' }}>
          {voted} of {pool.members.length} have voted
        </div>
        {allRunoffVoted && (
          <Btn onClick={handleFinalize} variant="dark">Finalize and generate schedule</Btn>
        )}
      </Card>
    );
  }

  // Non-creator voting form
  return (
    <Card style={{ border:`2px solid ${C.peach}` }}>
      <SLabel style={{ marginBottom:'8px' }}>Round 2 — your vote</SLabel>
      <div style={{ fontSize:'14px', color:C.gray, marginBottom:'16px' }}>

      </div>

      {(rs.newDays||[]).length > 0 && (

          <div style={{ fontSize:'14px', fontWeight:'600', color:C.darkGray, marginBottom:'8px' }}>

          </div>

            {(rs.newDays||[]).map(d => (

      {nw && (
        <div style={{ marginBottom:'16px' }}>
          <div style={{ fontSize:'14px', fontWeight:'600', color:C.darkGray, marginBottom:'8px' }}>

          <div style={{ marginBottom:'10px' }}>
            <div style={{ fontSize:'13px', color:C.gray, marginBottom:'6px' }}>Start: {nw.earliest}</div>
            <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
              <Chip label="Works for me" active={startAccept} onClick={()=>setStartAccept(true)} />
              <Chip label="Too early" active={!startAccept} onClick={()=>setStartAccept(false)}
                activeColor={C.darkRose} activeBg={C.rose} />
            </div>
            {!startAccept && (
              <div style={{ marginTop:'8px' }}>
                <SInput value={startVote} onChange={setStartVote}>
                  {TIME_SLOTS.filter((_,i)=>i>slotIdx(nw.earliest)).map(t=><option key={t} value={t}>{t}</option>)}
                </SInput>
              </div>

          </div>
          <div>
            <div style={{ fontSize:'13px', color:C.gray, marginBottom:'6px' }}>End: {nw.latest}</div>
            <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
              <Chip label="Works for me" active={endAccept} onClick={()=>setEndAccept(true)} />
              <Chip label="Too late" active={!endAccept} onClick={()=>setEndAccept(false)}
                activeColor={C.darkRose} activeBg={C.rose} />
            </div>
            {!endAccept && (
              <div style={{ marginTop:'8px' }}>
                <SInput value={endVote} onChange={setEndVote}>
                  {TIME_SLOTS.filter((_,i)=>i>=slotIdx(nw.earliest)&&i<slotIdx(nw.latest)).reverse().map(t=><option key={t} value={t}>{t}</option>)}
                </SInput>
              </div>
            )}
          </div>
        </div>
      )}

      <Btn onClick={handleSubmitVote} variant="success">Submit round 2 vote</Btn>
    </Card>
  );
}

function TableTab({ pool, myName, onUpdate }) {
  const me = pool.members.find(m => m.name === myName);
  const isCreator = me?.isCreator;
  const [selectedDays, setSelectedDays] = useState([]);
  const [error, setError] = useState('');
  const [editingCooksPer, setEditingCooksPer] = useState(false);
  const [pendingCooksPer, setPendingCooksPer] = useState(pool.settings.cooksPer);

  const toggleLockDay = d => setSelectedDays(prev => prev.includes(d) ? prev.filter(x=>x!==d) : [...prev, d]);

  const handleLockIn = () => {
    if (selectedDays.length === 0) return setError('Select at least one day to lock in.');
    setError('');
    const updated = lockInDays(pool, selectedDays);
    onUpdate(updated);
  };

  const handleFinalize = (decisions, runoffProposal) => {
    const updated = applyCreatorDecisions(pool, decisions, runoffProposal);
    onUpdate(updated);
  };

  const handleSaveCooksPer = () => {
    const max = pool.settings.maxParticipants;
    if (max && max % pendingCooksPer !== 0) return;
    const updated = { ...pool, settings: { ...pool.settings, cooksPer: pendingCooksPer } };
    onUpdate(updated);
    setEditingCooksPer(false);
  };

  const { settings } = pool;
  const dayAvailability = ALL_WEEK.map(day => ({
    day,
    count: pool.members.filter(m => m.dayVotes && m.dayVotes[day]).length,
    total: pool.members.length,
  }));
  const agreedWin = pool.status === 'open' ? computeAgreedWindow(pool) : null;
  const displayWindow = pool.agreedWindow || computeAgreedWindow(pool);
  const cooksPerValid = !settings.maxParticipants || settings.maxParticipants % pendingCooksPer === 0;
  const stepperBtnStyle = {
    width:'36px', height:'36px', borderRadius:'50%', border:`2px solid ${C.lightGray}`,
    background:C.white, fontSize:'22px', cursor:'pointer', color:C.darkGray,
  };

  return (
    <div>
      {/* Table info card */}
      <Card>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'4px' }}>
          <SLabel style={{ marginBottom:0 }}>{pool.name}</SLabel>
          <span style={{ fontFamily:'monospace', fontSize:'14px', color:C.gray, letterSpacing:'1px' }}>{pool.code}</span>
        </div>
        <Divider />

        {/* Cooks/night */}
        <div style={{ marginBottom:'8px', display:'flex', alignItems:'center', gap:'12px', flexWrap:'wrap' }}>
          <span style={{ fontSize:'16px', color:C.darkGray }}>
            Cooks/night: <strong style={{ fontSize:'22px', fontFamily:"'ZTNature',Helvetica,sans-serif", color:C.darkerGray }}>{settings.cooksPer}</strong>
          </span>
          {isCreator && pool.status === 'open' && !editingCooksPer && (
            <button onClick={() => { setPendingCooksPer(settings.cooksPer); setEditingCooksPer(true); }} style={{
              background:'none', border:`1.5px solid ${C.gray}`, borderRadius:'12px',
              padding:'2px 10px', fontSize:'12px', color:C.gray, cursor:'pointer',
              fontFamily:"'Roboto',sans-serif",
            }}>Edit</button>
          )}
        </div>

        {editingCooksPer && (
          <div style={{ marginBottom:'12px', padding:'12px', background:'#f7f3ee', borderRadius:'10px' }}>
            {settings.maxParticipants && (
              <div style={{ fontSize:'13px', color:C.gray, marginBottom:'8px' }}>
                Must divide evenly into cap of {settings.maxParticipants}.
                Valid: {[1,2,3,4].filter(n => settings.maxParticipants % n === 0).join(', ')}
              </div>
            )}
            <div style={{ display:'flex', alignItems:'center', gap:'16px', marginBottom:'10px' }}>
              <button onClick={() => setPendingCooksPer(p => Math.max(1, p-1))} style={stepperBtnStyle}>−</button>
              <span style={{ fontSize:'26px', fontFamily:"'ZTNature',Helvetica,sans-serif",
                minWidth:'28px', textAlign:'center', color:C.darkerGray }}>{pendingCooksPer}</span>
              <button onClick={() => setPendingCooksPer(p => Math.min(4, p+1))} style={stepperBtnStyle}>+</button>
            </div>
            {!cooksPerValid && (
              <div style={{ fontSize:'13px', color:C.darkRose, marginBottom:'8px' }}>
                {pendingCooksPer} doesn't divide evenly into {settings.maxParticipants}.
              </div>
            )}
            <div style={{ display:'flex', gap:'8px' }}>
              <Btn onClick={handleSaveCooksPer} disabled={!cooksPerValid} style={{ fontSize:'14px', padding:'8px 18px' }}>Save</Btn>
              <Btn onClick={() => setEditingCooksPer(false)} variant="muted" style={{ fontSize:'14px', padding:'8px 18px' }}>Cancel</Btn>
            </div>
          </div>
        )}

        {/* Time window */}
        <div style={{ fontSize:'14px', color:C.gray, marginBottom:'8px' }}>
          Ideal time window: <strong style={{ color:C.darkGray }}>{displayWindow.earliest} – {displayWindow.latest}</strong>
        </div>

        {/* Members */}
        <div style={{ fontSize:'14px', color:C.gray }}>
          <strong style={{ color:C.darkGray }}>{pool.members.length}</strong> member{pool.members.length!==1?'s':''}
          {settings.maxParticipants && ` · ${settings.maxParticipants - pool.members.length} spot${settings.maxParticipants - pool.members.length !== 1 ? 's' : ''} left`}
        </div>
      </Card>

      {/* Open: availability summary + lock-in */}
      {pool.status === 'open' && (
        <>
          {isCreator ? (
            <Card>
              <SLabel style={{ marginBottom:'6px' }}>Member availability</SLabel>
              <div style={{ fontSize:'13px', color:C.gray, marginBottom:'14px' }}>
                {pool.members.length} member{pool.members.length!==1?'s':''} so far. Select the days to include in the schedule, then lock them in.
              </div>
              {dayAvailability.map(({ day, count, total }) => (
                <div key={day} style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'10px' }}>
                  <span style={{ minWidth:'36px', fontSize:'14px', fontWeight:'600', color:C.darkGray }}>{day}</span>
                  <div style={{ flex:1 }}>
                    <PctBar pct={total>0?count/total:0} passes={total>0&&count/total>=DAY_THRESHOLD} zero={count===0} />
                  </div>
                  <span style={{ fontSize:'12px', color:C.gray, minWidth:'32px' }}>{count}/{total}</span>
                  <Chip label="Include" active={selectedDays.includes(day)} onClick={()=>toggleLockDay(day)} />

                  background:'#f7f3ee', borderRadius:'8px' }}>
                  Tightest agreed window: <strong>{agreedWin.earliest} – {agreedWin.latest}</strong>
                  {' '}
                  <span style={{ color: agreedWin.tooNarrow ? C.darkRose : C.darkMint }}>
                    ({agreedWin.minuteSpan} min{agreedWin.tooNarrow ? ' — may be too narrow' : ''})
                  </span>
                </div>
              )}
              <div style={{ marginTop:'16px' }}>
                <ErrMsg msg={error} />
                <Btn onClick={handleLockIn} disabled={selectedDays.length===0} variant="dark">
                  Lock in days →
                </Btn>
              </div>
            </Card>
          ) : (
            <div style={{ padding:'14px 16px', background:C.lightGray, borderRadius:'12px',
              fontSize:'14px', color:C.gray, fontStyle:'italic' }}>
              Waiting for the host to lock in the schedule days.
            </div>
          )}
        </>
      )}

      {/* Closed: consensus report */}
      {pool.status === 'closed' && (
        <ConsensusReport pool={pool} isCreator={isCreator} onFinalize={handleFinalize} />
      )}

      {/* Runoff */}
      {pool.status === 'runoff' && (
        <RunoffVoting pool={pool} myName={myName} onUpdate={onUpdate} />
      )}

      {/* Scheduled */}
      {pool.status === 'scheduled' && (
        <div style={{ padding:'16px 20px', background:C.mint, borderRadius:'12px',
          color:C.darkMint, fontWeight:'600', textAlign:'center', fontSize:'16px' }}>

  );

// Returns { guestCount, presetLabels, freeformNotes, hasRestrictions, hasAlcoholFree }
// for active guests on a given night (non-cooks who haven't opted out).
function computeActiveGuests(pool, entry) {
  const optedOut = entry.optedOut || [];
  const active = pool.members.filter(m =>
    !entry.cooks.includes(m.name) && !optedOut.includes(m.name)
  );
  const presetCounts = {};
  for (const m of active) {
    for (const p of m.diet?.presets || []) {
      presetCounts[p] = (presetCounts[p] || 0) + 1;
    }
  }
  const presetLabels = Object.entries(presetCounts).map(([p, n]) => n > 1 ? `${p} (${n})` : p);
  const freeformNotes = active.map(m => m.diet?.note).filter(Boolean);
  return {
    guestCount: active.length,
    presetLabels,
    freeformNotes,
    hasRestrictions: presetLabels.length > 0 || freeformNotes.length > 0,
    hasAlcoholFree: (presetCounts['Alcohol-free'] || 0) > 0,
  };
}

function GuestSummaryBlock({ pool, entry, style = {} }) {
  const { guestCount, presetLabels, freeformNotes, hasRestrictions } = computeActiveGuests(pool, entry);
  return (
    <div style={{ padding:'12px 14px', background:'#f7f3ee', border:`1.5px solid ${C.babyYellow}`,
      borderRadius:'10px', fontSize:'14px', color:C.darkGray, lineHeight:1.6, ...style }}>

            <div key={i} style={{ fontSize:'13px', color:C.gray, fontStyle:'italic' }}>{n}</div>
          ))}
        </>
      ) : (
        <div>
          <strong>{guestCount} guest{guestCount!==1?'s':''}</strong> will be at your dinner.{' '}
          No dietary restrictions to worry about!

      )}
    </div>
  );
}

function buildICS(pool) {
  const MO = { Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12 };

  function parseSlot(slot) {
    // e.g. "6:00 PM" → { h, m }
    const [time, ampm] = slot.split(' ');
    let [h, m] = time.split(':').map(Number);
    if (ampm === 'PM' && h !== 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    return { h, m };
  }

  function toICSDate(dateStr, timeSlot) {
    // dateStr like "Tue Mar 11"
    const parts = dateStr.split(' ');
    const month = MO[parts[1]];
    const day = parseInt(parts[2], 10);
    const year = new Date().getFullYear();
    const { h, m } = parseSlot(timeSlot);
    const d = new Date(year, month - 1, day, h, m, 0);
    // If the date appears to be in the past (more than 30 days ago), bump year
    if (d < new Date(Date.now() - 30 * 24 * 60 * 60 * 1000)) d.setFullYear(year + 1);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  }

  function toICSDateEnd(dateStr, timeSlot) {
    const parts = dateStr.split(' ');
    const month = MO[parts[1]];
    const day = parseInt(parts[2], 10);
    const year = new Date().getFullYear();
    const { h, m } = parseSlot(timeSlot);
    const d = new Date(year, month - 1, day, h + 2, m, 0);
    if (d < new Date(Date.now() - 30 * 24 * 60 * 60 * 1000)) d.setFullYear(year + 1);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  }

  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}00Z`;

  const events = pool.schedule.map((entry, i) => {
    const startSlot = entry.meal?.startTime || entry.agreedWindow.earliest;
    const dtstart = toICSDate(entry.date, startSlot);
    const dtend   = toICSDateEnd(entry.date, startSlot);
    const uid = `bigtable-${pool.code}-${i}@thecriticalmoment.org`;
    const summary = `Dinner with ${pool.name}`;
    const location = entry.meal?.address ? entry.meal.address.replace(/,/g, '\\,') : '';
    const descParts = [`Cooks: ${entry.cooks.join(', ')}`];
    if (entry.meal?.name) descParts.push(`Meal: ${entry.meal.name}`);
    if (entry.meal?.bring) descParts.push(`Bring: ${entry.meal.bring}`);
    if (entry.meal?.note)  descParts.push(entry.meal.note);
    const description = descParts.join('\\n').replace(/,/g, '\\,');

    return [
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${dtstart}`,
      `DTEND:${dtend}`,
      `SUMMARY:${summary}`,
      location ? `LOCATION:${location}` : null,
      `DESCRIPTION:${description}`,
      'END:VEVENT',
    ].filter(Boolean).join('\r\n');
  });

  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Big Table//thecriticalmoment.org//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    ...events,
    'END:VCALENDAR',
  ].join('\r\n');
}

function ScheduleTab({ pool, myName, onUpdate }) {
  const [postingIdx, setPostingIdx] = useState(null);

  const handleDownloadICS = () => {
    const ics = buildICS(pool);
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `big-table-${pool.code}.ics`;
    a.click();
    URL.revokeObjectURL(url);
  };

  if (!pool.schedule) {
    return (
      <div style={{ textAlign:'center', padding:'48px 20px', color:C.gray }}>
        <div style={{ fontFamily:"'ZTNature',Helvetica,sans-serif", fontSize:'24px', color:C.darkerGray, marginBottom:'10px' }}>Not yet</div>
        <div style={{ fontSize:'16px', lineHeight:1.6 }}>
          The schedule unlocks once the table is closed and the consensus is finalized.
        </div>
      </div>
    );
  }

  const handlePostMeal = (idx, meal) => {
    const updated = { ...pool, schedule:pool.schedule.map((e,i) => i===idx ? {...e, meal} : e) };
    onUpdate(updated);
    setPostingIdx(null);
  };

  const handleOptOut = (idx, optingOut) => {
    const updated = {
      ...pool,
      schedule: pool.schedule.map((e, i) => {
        if (i !== idx) return e;
        const optedOut = optingOut
          ? [...(e.optedOut || []), myName]
          : (e.optedOut || []).filter(n => n !== myName);
        return { ...e, optedOut };
      })
    };
    onUpdate(updated);
  };

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'4px', flexWrap:'wrap', gap:'8px' }}>
        <SLabel style={{ marginBottom:0 }}>Dinner schedule</SLabel>
        <button onClick={handleDownloadICS} style={{
          background:'none', border:`1.5px solid ${C.darkMint}`, color:C.darkMint,
          borderRadius:'20px', padding:'5px 14px', fontSize:'13px', fontWeight:'500',
          cursor:'pointer', fontFamily:"'Roboto',sans-serif",
        }}>Download calendar (.ics)</button>
      </div>
      {pool.agreedDays && (
        <div style={{ fontSize:'13px', color:C.gray, marginBottom:'16px' }}>
          Active days: {pool.agreedDays.join(', ')} · Window: {pool.agreedWindow?.earliest} – {pool.agreedWindow?.latest}
        </div>
      )}
      {pool.schedule.map((entry, i) => {
        const isCook    = entry.cooks.includes(myName);
        const hasMeal   = !!entry.meal;
        const isOptedOut = (entry.optedOut || []).includes(myName);
        const monthDate = entry.date.split(' ').slice(1).join(' ');
        const { hasAlcoholFree } = computeActiveGuests(pool, entry);

        return (
          <Card key={i} style={{
            borderLeft:`4px solid ${isCook ? C.darkMint : isOptedOut ? C.lightGray : C.darkRose}`,
            opacity: isOptedOut ? 0.7 : 1,
          }}>

            {/* Card header */}
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'10px', gap:'8px' }}>
              <div>
                {hasMeal ? (
                  <div style={{ fontFamily:"'ZTNature',Helvetica,sans-serif", fontSize:'19px', color:C.darkerGray, marginBottom:'2px' }}>
                    On the Menu for {monthDate} at {entry.meal.startTime}
                  </div>
                ) : (
                  <>
                    <div style={{ fontFamily:"'ZTNature',Helvetica,sans-serif", fontSize:'19px', color:C.darkerGray, marginBottom:'2px' }}>{entry.date}</div>
                    <div style={{ fontSize:'13px', color:C.gray }}>{entry.agreedWindow.earliest} – {entry.agreedWindow.latest}</div>
                  </>
                )}
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:'4px', alignItems:'flex-end' }}>
                {isCook    && <Tag label="You're cooking" bg={C.mint} color={C.darkMint} />}
                {isOptedOut && <Tag label="Can't make it" bg={C.lightGray} color={C.gray} />}
              </div>
            </div>

            {/* Cook names */}
            <div style={{ marginBottom:'10px', fontSize:'15px' }}>
              <strong>Cook{entry.cooks.length>1?'s':''}:</strong> {entry.cooks.join(', ')}
            </div>

            {/* Posted meal details */}
            {hasMeal && (
              <div style={{ padding:'12px 14px', background:C.white, borderRadius:'10px', marginBottom:'12px', border:`1px solid ${C.lightGray}` }}>
                <div style={{ fontWeight:'700', fontSize:'16px', marginBottom:'8px' }}>{entry.meal.name}</div>
                <div style={{ display:'flex', flexDirection:'column', gap:'4px', fontSize:'14px', color:C.darkGray }}>
                  <div><strong>Start:</strong> {entry.meal.startTime}</div>
                  {entry.meal.prepHelp && entry.meal.prepStartTime && (
                    <div><strong>Prep help</strong> needed from {entry.meal.prepStartTime}</div>
                  )}
                  <div>
                    <strong>Drinks:</strong>{' '}
                    {entry.meal.drinks === 'provided' ? 'Drinks provided' : 'BYOB'}
                    {entry.meal.drinks === 'provided' && hasAlcoholFree && (
                      <span style={{ color:C.gray, fontStyle:'italic' }}> — note: alcohol-free guests attending</span>
                    )}
                  </div>
                  <div><strong>Address:</strong> {entry.meal.address}</div>
                  {entry.meal.bring && <div><strong>Bring:</strong> {entry.meal.bring}</div>}
                  {entry.meal.note  && <div style={{ fontStyle:'italic', color:C.gray }}>{entry.meal.note}</div>}
                </div>
              </div>
            )}

            {/* Aggregated guest dietary summary */}
            <GuestSummaryBlock pool={pool} entry={entry} style={{ marginBottom:'12px', fontSize:'13px' }} />

            {/* Opted-out members list */}
            {(entry.optedOut || []).length > 0 && (
              <div style={{ fontSize:'12px', color:C.gray, marginBottom:'10px' }}>
                Can't make it: {entry.optedOut.join(', ')}
              </div>
            )}

            {/* Opt-out toggle (non-cooks only) */}
            {!isCook && (
              <div style={{ marginBottom: (isCook || hasMeal) ? '0' : '4px' }}>
                {isOptedOut ? (
                  <Btn onClick={()=>handleOptOut(i, false)} variant="muted"
                    style={{ fontSize:'13px', padding:'6px 14px' }}>
                    I can make it after all
                  </Btn>
                ) : (
                  <Btn onClick={()=>handleOptOut(i, true)} variant="muted"
                    style={{ fontSize:'13px', padding:'6px 14px', color:C.gray }}>
                    Can't make it
                  </Btn>
                )}
              </div>
            )}

            {/* Post meal button / form */}
            {isCook && !hasMeal && postingIdx !== i && (
              <Btn onClick={()=>setPostingIdx(i)} variant="accent"
                style={{ fontSize:'14px', padding:'8px 18px', marginTop:'8px' }}>
                Post meal info
              </Btn>
            )}
            {postingIdx === i && (
              <MealPostForm entry={entry} pool={pool} myName={myName}
                onPost={meal=>handlePostMeal(i,meal)} onCancel={()=>setPostingIdx(null)} />
            )}
          </Card>
        );
      })}
    </div>
  );
}

// ─── PROGRESS BAR ─────────────────────────────────────────────────────────────

function ProgressBar({ pool }) {
  const allMealsPosted = pool.schedule && pool.schedule.length > 0 && pool.schedule.every(e => e.meal);
  const step = allMealsPosted ? 3 : pool.status === 'scheduled' ? 2 : 1;
  const steps = [
    { label:'Forming', desc:'Gathering members' },
    { label:'Scheduled', desc:'Who cooks when' },
    { label:'Ready', desc:'All meals posted' },
  ];
  return (
    <div style={{ marginBottom:'14px' }}>
      <div style={{ display:'flex', gap:'6px' }}>
        {steps.map((s, i) => (
          <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:'4px' }}>
            <div style={{ width:'100%', height:'6px', borderRadius:'3px',
              background: i+1 <= step ? C.darkMint : C.lightGray }} />
            <span style={{ fontSize:'11px', fontWeight: i+1===step?'700':'400',
              color: i+1 <= step ? C.darkMint : C.gray, textAlign:'center' }}>
              {s.label}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ROOM SCREEN ──────────────────────────────────────────────────────────────

function RoomScreen({ session, onLeave }) {
  const [pool,    setPool]    = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab,     setTab]     = useState('table');

  useEffect(() => {
    const unsub = Store.subscribePool(session.code, p => {
      if (p) { setPool(p); setLoading(false); }
    });
    return unsub;
  }, [session.code]);

  const onUpdate = async (updatedPool) => {
    setPool(updatedPool);
    await Store.savePool(updatedPool);
  };

  if (loading) {
    return <div style={{ padding:'48px', textAlign:'center', color:C.gray, fontFamily:"'Roboto'" }}>Loading…</div>;
  }

  const tabs = [
    { id:'table',    label:'Table'    },
    { id:'members',  label:'Members'  },
    { id:'schedule', label:'Schedule', locked:!pool.schedule },
  ];

  const isCreator = pool.members.find(m => m.name === session.name)?.isCreator;
  const allMealsPosted = pool.schedule && pool.schedule.length > 0 && pool.schedule.every(e => e.meal);
  const guidanceMsg = pool.status === 'open' && isCreator
    ? 'When everyone has joined, select which days work and lock in the schedule.'
    : pool.status === 'open' && !isCreator
    ? "You're all set! Waiting for the host to lock in the dinner days."
    : pool.status === 'scheduled' && !allMealsPosted
    ? 'Check the Schedule tab — cooks can post their meal details for each dinner night.'
    : pool.status === 'scheduled' && allMealsPosted
    ? 'All meals are posted. Everyone knows when and what to eat!'
    : null;

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'6px' }}>
        <div style={{ fontSize:'14px', color:C.gray }}>
          Signed in as <strong style={{ color:C.darkGray }}>{session.name}</strong>
          <span style={{ marginLeft:'8px', fontFamily:'monospace', fontSize:'13px' }}>{pool.code}</span>
        </div>
        <button onClick={onLeave} style={{ background:'none', border:'none', color:C.gray,
          cursor:'pointer', fontSize:'13px', fontFamily:"'Roboto'" }}>Leave</button>
      </div>
      <Divider />

      <ProgressBar pool={pool} />
      {guidanceMsg && <GuidanceBanner>{guidanceMsg}</GuidanceBanner>}

      <div style={{ display:'flex', gap:'0', marginBottom:'22px', borderBottom:`2px solid ${C.lightGray}` }}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>!t.locked&&setTab(t.id)} style={{
            padding:'10px 18px', background:'none', border:'none',
            borderBottom: tab===t.id ? `3px solid ${C.darkRose}` : '3px solid transparent',
            marginBottom:'-2px', cursor:t.locked?'not-allowed':'pointer',
            fontFamily:"'ZTNature',Helvetica,sans-serif", fontSize:'18px', fontWeight:'500',
            color: t.locked ? C.lightGray : tab===t.id ? C.darkRose : C.gray,
            transition:'color 0.15s, border-color 0.15s',
          }}>
            {t.label}{t.locked && <span style={{ fontSize:'12px', marginLeft:'4px' }}>(locked)</span>}
          </button>
        ))}
      </div>

      {tab==='table'    && <TableTab    pool={pool} myName={session.name} onUpdate={onUpdate} />}
      {tab==='members'  && <MembersTab  pool={pool} myName={session.name} onUpdate={onUpdate} />}
      {tab==='schedule' && <ScheduleTab pool={pool} myName={session.name} onUpdate={onUpdate} />}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────

function App() {
  const [screen,      setScreen]      = useState('loading');
  const [session,     setSession]     = useState(null);
  const [pendingPool, setPendingPool] = useState(null); // pool found in join-code, passed to join-new

  useEffect(() => {
    (async () => {
      const sess = Store.getSession();
      if (sess) {
        const p = await Store.getPool(sess.code);
        if (p && p.members.find(m => m.name === sess.name)) {
          setSession(sess); setScreen('room'); return;
        }
        Store.clearSession();
      }
      setScreen('home');
    })();
  }, []);

  const enterRoom = (sess) => {
    setSession(sess); setScreen('room');
  };

  const handleSelectMember = (p, name) => {
    Store.saveSession({ code:p.code, name });
    enterRoom({ code:p.code, name });
  };

  const handleJoinNew = (p) => {
    setPendingPool(p);
    setScreen('join-new');
  };

  const handleLeave = () => {
    Store.clearSession();
    setSession(null); setScreen('home');
  };

  if (screen === 'loading') {
    return <div style={{ padding:'48px', textAlign:'center', color:C.gray, fontFamily:"'Roboto'" }}>Loading…</div>;
  }

  return (
    <div id="big-table-root">
      {screen==='home'     && <HomeScreen onCreate={()=>setScreen('create')} onJoin={()=>setScreen('join-code')} />}
      {screen==='create'   && <CreateScreen onBack={()=>setScreen('home')} onEnterRoom={enterRoom} />}
      {screen==='join-code'&& <JoinCodeScreen onBack={()=>setScreen('home')} onSelectMember={handleSelectMember} onJoinNew={handleJoinNew} />}
      {screen==='join-new' && pendingPool && (
        <JoinNewScreen pool={pendingPool} onBack={()=>setScreen('join-code')} onEnterRoom={enterRoom} />
      )}
      {screen==='room' && session && (
        <RoomScreen session={session} onLeave={handleLeave} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('big-table-root')).render(<App />);
</script>
